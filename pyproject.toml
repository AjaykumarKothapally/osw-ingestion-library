[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osw_ingestion"
version = "0.1.0"
description = "Reusable data ingestion utilities for Microsoft Fabric"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]